name: Compilar portable Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-windows.yml'
      - 'app.py'
      - 'requirements*.txt'
      - 'web/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  portable-windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: pip
      - name: Dependencias de compilación
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Pruebas automatizadas
        run: python -m unittest discover -s tests -q
      - name: Empaquetar ejecutable sin consola
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name EvaluaFP_Portatil --icon assets/EvaluaFP.ico --add-data "web;web" --collect-all fitz --collect-all PIL --collect-all docx --collect-all keyring --collect-all webview --collect-all reportlab --collect-all cryptography --collect-all xlsxwriter --hidden-import xlwt --hidden-import webview.platforms.winforms --hidden-import desktop_caption app.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller ha fallado.' }
      - name: Preparar carpeta portátil y verificar
        shell: pwsh
        run: |
          $ver = (Select-String -Path app.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $root = 'dist/EvaluaFP_Portatil_Windows'
          New-Item -ItemType Directory -Force -Path $root, "$root/EvaluaFP_Datos", "$root/EvaluaFP_Copias" | Out-Null
          Copy-Item dist/EvaluaFP_Portatil.exe "$root/EvaluaFP_Portatil.exe"
          Copy-Item ejemplos/EvaluaFP.portable.json "$root/EvaluaFP.portable.json"
          & "$root/EvaluaFP_Portatil.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw 'No se ha superado la prueba de arranque del EXE.' }
          Compress-Archive -Path "$root/*" -DestinationPath "dist/EvaluaFP_Portatil_${ver}_windows_x64.zip" -CompressionLevel Optimal -Force
      - name: Publicar paquete Windows
        uses: actions/upload-artifact@v4
        with:
          name: evaluafp-windows-x64
          path: dist/EvaluaFP_Portatil_*_windows_x64.zip
          if-no-files-found: error
          retention-days: 30
